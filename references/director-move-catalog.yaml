  - {id: E01, category: E, name: 来源全貌局部回环, trigger: '一份证据既要证明出处又要读取细节', mental_image: '镜头从整页到关键处，再退回确认其所在位置', execution: '执行全貌、局部框选、放大阅读、回到全貌四步', why: '兼顾可信度、可读性和上下文', avoid: '不要停留在局部裁切后直接切走'}
  - {id: E02, category: E, name: 功能人物卡, trigger: '人物身份只为解释角色、关系或决策责任', mental_image: '头像、姓名和功能角色形成一张简洁证据卡', execution: '只保留当前论点所需身份，并与文件、组织或时间节点连接', why: '人物从名人素材变成叙事变量', avoid: '不要泛化肖像、虚构身份细节或堆无关履历'}
  - {id: E03, category: E, name: 关系线标确定性, trigger: '文稿涉及控制、投资、合作、指控、推测或影响关系', mental_image: '不同线型和标签明确告诉观众关系的性质与把握程度', execution: '用方向、线型、颜色和文本标明已证实、声称、推测或未决', why: '关系图不会把证据等级抹平', avoid: '不要把相关、合作或指控一律画成确定控制关系'}
  - {id: E04, category: E, name: 因果节点递进, trigger: '需要解释多步机制或事件链', mental_image: '每一步成立后保留，下一步在其基础上出现', execution: '节点按顺序点亮，连接随因果建立，当前步骤高亮', why: '保留状态让观众记得因果如何累积', avoid: '不要每步清空，迫使观众重新记忆前文'}
  - {id: E05, category: E, name: 基线差值结论, trigger: '数据主张是增长、下降、节省、差距或性能提升', mental_image: '先有零点或旧值，再看变化，最后落到结论', execution: '依次显示基线、变化量、终值和口径，必要时保持同尺度', why: '观众能区分绝对值与增量', avoid: '不要只出现终值或用截断坐标夸大差异'}
  - {id: E06, category: E, name: 时间层级编码, trigger: '叙事同时包含时代、年份、事件和短期变化', mental_image: '大时间控制章节，小时间定位证据', execution: '章节年份、事件日期和动画时序使用不同层级与位置', why: '多时间尺度不会互相混淆', avoid: '不要把所有日期做成同一字号和同一权重'}
  - {id: E07, category: E, name: 产品谱系编排, trigger: '产品、版本或技术代际需要展示演化', mental_image: '多个对象沿一条可读血缘线出现，当前代突出', execution: '按时间或功能排列对象，保持尺度规则，标出分支与继承', why: '谱系能同时表达数量、顺序与关联', avoid: '不要把产品图堆成没有时间和关系的海报墙'}
  - {id: E08, category: E, name: 成本结果拆账, trigger: '文稿讨论资金、成本、利润、损耗或经济后果', mental_image: '总额被拆成来源、去向、变化和最终结果', execution: '从总额到组成或路径，再显示损益和受影响对象', why: '金额不再是孤立冲击值，而能解释机制', avoid: '不要混用币种、时间窗或把相关金额直接相加'}
  - {id: K01, category: K, name: 主体语义色, trigger: '多个角色、品牌、阵营或方案需要持续辨认', mental_image: '每个主体拥有稳定颜色，跨图表、关系线和章节保持一致', execution: '建立主体色映射，只将颜色用于身份和状态，不随场景任意更换', why: '颜色成为跨镜头的低成本身份线索', avoid: '不要同一主体前后换色，也不要仅依赖真实Logo色'}
  - {id: K02, category: K, name: 风险证据红, trigger: '出现冲突、警告、损失、争议或关键证据', mental_image: '红色只在风险点和证据标记处出现', execution: '大部分画面保持中性，红色用于框选、路径、数字或结论', why: '稀缺颜色能形成明确警报层级', avoid: '不要整片泛红导致风险信号失去区分'}
  - {id: K03, category: K, name: 激活成功信号色, trigger: '节点启动、路径通畅、性能达标或新能力开启', mental_image: '一个高亮信号沿系统被点亮', execution: '在中性系统上用绿、青或其他信号色标示激活状态', why: '状态色让变化可被瞬间识别', avoid: '不要把信号色当背景主色淹没状态差异'}
  - {id: K04, category: K, name: 中性证据底色, trigger: '文件、人物、数据和多个语义色需要同屏', mental_image: '白、灰、黑构成安静底座，让证据自己说话', execution: '控制背景和辅助线对比，将饱和色留给身份、风险和状态', why: '中性底色提高文字与多来源材料兼容性', avoid: '不要用单一品牌色覆盖所有层级'}
  - {id: K05, category: K, name: 历史纸张材质, trigger: '旧时代、企业史、报刊或档案章节需要年代区分', mental_image: '纸纤维、印刷颗粒和有限色像真实载体而非滤镜', execution: '轻量使用纸纹、半色调、墨迹和页边，保持文字高对比', why: '材质为时间语义服务', avoid: '不要过度做旧、加噪或假装原始文物'}
  - {id: K06, category: K, name: 技术网格材质, trigger: '工程、算力、设备、数据或软件机制需要精确感', mental_image: '克制网格、刻度、窗口和表面反射围绕真实信息工作', execution: '只在需要定位、测量和分层处使用网格与技术表面', why: '技术材质提供坐标和系统感', avoid: '不要使用无信息的赛博雨、乱码和满屏扫描线'}
  - {id: K07, category: K, name: 章节材质换挡, trigger: '叙事从历史、现实、机制或未来之间切换', mental_image: '同一配色骨架下，材质从纸面切到实验台或真实影像', execution: '保留字体和语义色，只更换背景材质、边框和光照规则', why: '既明确换章，又不切断整片身份', avoid: '不要每章都像来自不同模板库'}
  - {id: K08, category: K, name: 实拍自然色保护, trigger: 'MG框架中嵌入真实产品、人物或现场', mental_image: '实拍保持可信肤色和材质，框架退到辅助层', execution: '只做必要统一和对比控制，不用主题色强行覆盖主体', why: '真实素材承担存在性，过度调色会削弱可信度', avoid: '不要把实拍全部染成MG主题色或牺牲细节'}
  - {id: M01, category: M, name: 分层揭示, trigger: '信息有明确理解顺序或对象需要从未知到可见', mental_image: '遮挡、轮廓或层级按语义顺序被揭开', execution: '先露主体，再露标签、关系和结论，控制每次新增信息量', why: '揭示让注意力沿既定路径移动', avoid: '不要无差别淡入所有元素'}
  - {id: M02, category: M, name: 同槽替换, trigger: '同类人物、文件、产品、年份或状态连续出现', mental_image: '旧对象退出同一槽位，新对象接管位置', execution: '保持容器、尺度和相机稳定，以切换、滑动或遮罩替换内容', why: '变化清楚而空间记忆不被破坏', avoid: '不要每次替换都移动整个版式'}
  - {id: M03, category: M, name: 对齐归位, trigger: '散落对象需要形成比较、分类或结论结构', mental_image: '对象从来源位置移动到共同基线或网格', execution: '先保留来源关系，再让对象沿可追踪路径对齐', why: '运动本身解释了归类和比较', avoid: '不要让对象瞬移后依赖旁白补充逻辑'}
  - {id: M04, category: M, name: 堆叠计数, trigger: '数量、规模、份额或资源增长需要具身表达', mental_image: '对象逐个增加、填满或堆高到目标值', execution: '设定单位对象和上限，按节奏累加并最终显示数值口径', why: '数量增长通过空间变化被感知', avoid: '不要堆无法对应单位的装饰粒子'}
  - {id: M05, category: M, name: 连接传播, trigger: '关系建立、能量流动、信息传递或故障扩散', mental_image: '一条有方向的信号从源头经过节点到达结果', execution: '先建立节点，再逐段点亮连接和受影响状态', why: '传播顺序同时表达方向与时间', avoid: '不要一次点亮全部线条或用随机脉冲冒充机制'}
  - {id: M06, category: M, name: 隔离放大, trigger: '复杂系统中的一个局部成为当前解释重点', mental_image: '其他区域退暗，关键区域被圈定并放大', execution: '先给整体坐标，隔离目标，放大解释，最后回到整体', why: '注意力集中且上下文不丢失', avoid: '不要从未知位置直接切到局部特写'}
  - {id: M07, category: M, name: 拆解重组, trigger: '对象由多层、多零件或多个功能模块构成', mental_image: '完整对象沿结构轴拆开，解释后回到可识别整体', execution: '按真实层级分离零件，标出作用，再按原路径重组', why: '拆解揭示结构，重组确认理解', avoid: '不要为了炫技爆炸成无法对应真实结构的碎片'}
  - {id: M08, category: M, name: 稳定构图微更新, trigger: '高密度机制或长期比较需要连续观察', mental_image: '相机和主体不动，只有当前变量改变', execution: '锁定舞台，以数值、颜色、层级或局部运动做增量更新', why: '稳定不是缺乏动效，而是主动控制变量', avoid: '不要为保持刺激而频繁推拉摇移'}
  - {id: X01, category: X, name: 同世界硬切, trigger: '语义已切换但视觉世界、构图槽位或证据类型仍一致', mental_image: '像编辑桌快速换一张材料，空间规则不变', execution: '在动作或语义断点硬切，同一外框和对齐继续保留', why: '硬切高效，避免过度转场拖慢信息片', avoid: '不要在没有连续锚点时硬切造成位置迷失'}
  - {id: X02, category: X, name: 黑白场清章, trigger: '需要结束旧章节并让下一段重新获得注意力', mental_image: '旧信息退到纯色，短暂停顿后新章进入', execution: '用黑场或白场完成清屏，并让新章首个对象独立落位', why: '纯色场是最明确的状态重置', avoid: '不要频繁闪白伤眼或把清场当装饰节拍'}
  - {id: X03, category: X, name: 对象形状遮罩, trigger: '前后章节共享圆环、镜头、屏幕、轮胎或其他语义形状', mental_image: '共享对象扩展成入口，带观众穿到下一场', execution: '使用真实对象轮廓做遮罩，前后保持方向和中心连续', why: '转场形状来自内容，风格和语义同时连贯', avoid: '不要套用与内容无关的圆形擦除'}
  - {id: X04, category: X, name: 窗口伸缩交接, trigger: '容器内证据需要短暂转为全屏，或全屏素材要回到系统界面', mental_image: '内容窗口像镜头一样放大接管，再缩回原位', execution: '保持同一素材连续，动画窗口边界和背景层级', why: '观众不会误以为进入无关片段', avoid: '不要在缩放中更换素材或改变裁切焦点'}
  - {id: X05, category: X, name: 领域动作擦除, trigger: '场景存在赛车、扫描、翻页、胶片、车轮或产线等真实运动语汇', mental_image: '领域对象自然经过镜头并带走旧画面', execution: '让对象运动方向与下一镜头入场方向一致', why: '转场来自世界内部而非外加特效', avoid: '不要为了漂亮复制不属于该领域的转场'}
  - {id: X06, category: X, name: 形态匹配切换, trigger: '前后对象在轮廓、位置、动作或构图上存在可对应关系', mental_image: '一个形状在切点瞬间变成另一个含义不同的对象', execution: '预先对齐尺度、中心和运动方向，在动作峰值切换', why: '视觉连续承担概念类比', avoid: '不要牺牲信息准确性强行找相似形状'}
  - {id: X07, category: X, name: 年份章节卡, trigger: '长片跨越较大年代或进入新的历史阶段', mental_image: '大年份独占画面，成为时间坐标的路标', execution: '先清场，再显示年份与短章节名，然后进入该阶段首个证据', why: '观众能重新校准时间位置', avoid: '不要只闪过年份而没有阶段语义'}
  - {id: X08, category: X, name: 共享动作跨风格, trigger: '纸面、实拍、技术图或3D等不同视觉系统必须切换', mental_image: '一个相同方向的推入、旋转、展开或视线动作跨越两种材质', execution: '保留动作向量或对象位置，切换材质和世界规则', why: '动作连续能缓冲风格断裂', avoid: '不要同时改变材质、构图、方向和节奏'}
  - {id: H01, category: H, name: 概念先行现实证明, trigger: '文稿先定义能力或关系，随后需要证明真实落地', mental_image: 'MG先搭概念模型，实拍随后展示现实对象或事件', execution: '用MG建立判断框架，在结论点硬切或窗口扩展到实拍', why: '先理解后验证，实拍不再只是素材插入', avoid: '不要先堆实拍再用MG重复同一信息'}
  - {id: H02, category: H, name: 干净实拍后加HUD, trigger: '实拍需要叠加识别、导航、测量或状态信息', mental_image: '先让观众看清真实场景，再打开一层感知界面', execution: '保留数帧干净镜头，随后让HUD绑定对象或视线进入', why: '观众能区分现实与解释层', avoid: '不要从第一帧就用HUD遮满画面'}
  - {id: H03, category: H, name: 档案落入证据页, trigger: '历史实拍、老照片或新闻片段需要被纳入论证', mental_image: '素材从全屏现实收进档案页，旁边出现日期和出处', execution: '先展示素材语境，再缩入固定证据槽并补充标签', why: '实拍获得来源和时间位置', avoid: '不要把档案素材当无出处B-roll使用'}
  - {id: H04, category: H, name: 产品机制往返, trigger: '真实产品需要解释内部原理后再确认外部结果', mental_image: '从产品表面进入MG剖面，再回到同一真实产品', execution: '使用共同轮廓或坐标连接实拍、机制图和实拍结果', why: '解释不会切断产品身份', avoid: '不要机制段结束后回到完全不同型号或角度'}
  - {id: H05, category: H, name: 窗口图解往返, trigger: '采访、网页或活动素材中的一句信息需要展开解释', mental_image: '当前窗口缩成证据，旁边或全屏长出关系图，再回到素材', execution: '保持窗口作为来源锚点，让MG从被引用位置生长', why: '解释与原始材料之间的来源关系清楚', avoid: '不要切到抽象图后忘记回到证据上下文'}
  - {id: H06, category: H, name: 实拍数据标准化, trigger: '发布会屏幕、仪表或截图中的数据需要跨来源比较', mental_image: '先看到原始数据，再进入统一尺度的干净图表', execution: '展示原始页面并标出字段，随后重绘为标注来源的标准图', why: '兼顾真实性与可比性', avoid: '不要悄悄改口径、截断坐标或省略来源'}
  - {id: H07, category: H, name: 跨画幅安全容器, trigger: '横屏、竖屏、方形、手机录屏和采访要混剪', mental_image: '不同画幅都进入同一可伸缩但不变形的舞台', execution: '使用裁切焦点、背景延展和固定安全边距，禁止拉伸', why: '异质素材可读且全片连续', avoid: '不要用模糊复制背景掩盖错误构图'}
  - {id: H08, category: H, name: 覆盖层前后对照, trigger: 'MG叠加层会改变观众对实拍的读取', mental_image: '先看原始状态，再看解释层，必要时再关闭确认', execution: '执行干净实拍、叠加解释、回看干净或结果三个状态', why: '观众能判断哪些信息来自现实、哪些来自MG', avoid: '不要让标注永久覆盖关键细节'}
  - {id: L01, category: L, name: 全片视觉令牌锁定, trigger: '长片、多章节或多人协作容易出现风格漂移', mental_image: '字体、圆角、线宽、阴影、语义色和动效速度组成一套小型语法', execution: '在制作前冻结令牌，所有组件和章节从同一组值派生', why: '一致性来自可执行约束而非模糊风格词', avoid: '不要每个镜头临时挑颜色、字体和圆角'}
  - {id: L02, category: L, name: 镜头接口台账, trigger: '多个镜头或生成批次需要无缝衔接', mental_image: '每镜结尾状态成为下一镜开头的明确输入', execution: '记录对象位置、相机、背景、颜色、可见层和运动方向', why: '连续性变成可核对数据', avoid: '不要只写同一风格而忽略具体结束状态'}
  - {id: L03, category: L, name: 长片回顾锚点, trigger: '长片跨越多个章节，观众可能忘记主线或当前位置', mental_image: '关键对象、地图、时间轴或工作台周期性回到总览', execution: '每个大章末回到同一全局结构并更新已完成状态', why: '回顾压缩前文并为下一章定位', avoid: '不要用重复片头代替有状态更新的回顾'}
  - {id: L04, category: L, name: 因果状态台账, trigger: '关系、流程或调查图在多段中持续增长', mental_image: '已经证明的节点保持，未证明节点仍为空或虚线', execution: '维护节点状态、证据来源和确定性，后续只做增量修改', why: '叙事逻辑不会因换镜头被重置', avoid: '不要让前后图中的关系方向和结论互相矛盾'}
  - {id: L05, category: L, name: 单一高能动作, trigger: '产品发布、快讯或节奏段需要明显冲击', mental_image: '一个主动作夺取注意力，其他信息保持稳定', execution: '每个节拍只选择尺度、位移、切换或数字增长中的一个主动作', why: '高能来自清晰重音而非所有元素同时乱动', avoid: '不要把入场、旋转、闪光、推镜和粒子叠在同一瞬间'}
  - {id: L06, category: L, name: 高密度段稳镜头, trigger: '画面要解释复杂机制、关系或多项数据', mental_image: '相机像实验观察者保持稳定，内容在框内变化', execution: '减少推拉摇移，使用分层揭示、局部高亮和状态更新', why: '运动预算留给信息变化', avoid: '不要在观众阅读时持续大幅运镜'}
  - {id: L07, category: L, name: 清空呼吸状态, trigger: '连续高密度信息后进入新观点或结论', mental_image: '画面暂时只剩一个对象、一个短词或纯背景', execution: '在章节间插入短清场，让上一段元素完全退出', why: '认知呼吸提高下一段的进入效率', avoid: '不要用无关空镜拖时长，也不要清空后立刻塞满'}
  - {id: L08, category: L, name: 声画同步证据门禁, trigger: '想把点击、数字、标记或转场精确卡在声音上', mental_image: '每个同步点都有可定位的音频事件或旁白重音', execution: '只有在读取波形或时间轴后写精确同步，否则标为待对齐', why: '避免把推测写成已验证节奏事实', avoid: '不要仅凭静帧或联系表声称音效与动作同步'}
  - {id: Q01, category: Q, name: 禁止补造事实, trigger: '来源不完整、文字模糊或文稿包含未核实数字和人物关系', mental_image: '不确定信息保持不确定，而不是被画面包装成确定事实', execution: '使用占位、条件语气、来源标记或请求核实，不生成具体伪证', why: '视觉可信度不能替代事实证据', avoid: '不要发明日期、金额、Logo、引文、页面和人物身份'}
  - {id: Q02, category: Q, name: 拒绝万能科技HUD, trigger: '题材涉及AI、芯片、汽车、能源或数据', mental_image: '先问信息结构需要什么，再决定是否需要界面语言', execution: '每条线、框、读数和扫描都绑定具体语义或对象', why: '功能性图形比类型片装饰更可信', avoid: '不要用乱码、无意义波形和随机圆环填空'}
  - {id: Q03, category: Q, name: 文字可读性门禁, trigger: '画面包含标题、数据、原文、标签或竖屏小窗', mental_image: '在实际输出尺寸和停留时间下，目标观众能完成阅读', execution: '按画幅检查字号、对比、行长、停留、遮挡和安全区', why: '文字读不完等于信息没有出现', avoid: '不要用设计稿放大预览掩盖成片不可读'}
  - {id: Q04, category: Q, name: 证据无遮挡门禁, trigger: '文件、截图、人物动作或产品细节承担论证', mental_image: '关键证据区域始终完整可见，装饰主动让位', execution: '标记证据热区，检查窗口、字幕、HUD和转场是否遮挡', why: '画面美感不能破坏证据责任', avoid: '不要让标题条、底部字幕或发光层盖住关键文字和对象'}
  - {id: Q05, category: Q, name: 数据口径门禁, trigger: '使用任何数字、图表、比例、金额或性能比较', mental_image: '每个数值旁都有单位、时间、基线和来源位置', execution: '在脚本卡和画面验收中逐项核对口径与比例尺', why: '数据图形只有口径完整才有意义', avoid: '不要混合累计值、单年值、百分比和绝对量'}
  - {id: Q06, category: Q, name: 关系确定性门禁, trigger: '人物、公司、资金或技术之间建立连线', mental_image: '每条线都能回答谁到谁、什么关系、证据等级多高', execution: '要求方向、关系词、来源和确定性状态齐全', why: '连线是强断言，必须可审计', avoid: '不要用视觉接近或共同出现暗示未经证实的控制关系'}
  - {id: Q07, category: Q, name: 方法冲突消解门禁, trigger: '一个语义段同时触发多条视觉方法或复合程序', mental_image: '所有方法围绕同一主体和同一状态骨架分工，而不是各自播放一套效果', execution: '先定主程序，再为辅助方法分配证据、世界、构图、文字、运动、连续性或护栏职责，并显式记录冲突决策', why: '多维组合只有共享视觉因果时才会立体，否则只是拼贴', avoid: '不要把多个方法平权并列、同时开多个场景或让辅助效果夺走主动作'}
  - {id: Q08, category: Q, name: 增量修复优先, trigger: '审片发现局部节奏、文字、连续性或事实问题', mental_image: '保留已成立的视觉世界，只修导致失败的最小变量', execution: '记录问题、证据、改动和回归点，按优先级做delta patch', why: '避免重写引入新的风格漂移和事实错误', avoid: '不要因一个局部问题推翻整套成功结构'}
